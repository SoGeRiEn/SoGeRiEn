# External MCP servers template for Codex config.toml
# Root: C:\MCP_V3\MCP_EXTERNAL
# Keep risky external MCP disabled until credentials/runtime are configured.

[mcp_servers.external_windows_mcp]
command = '%USERPROFILE%\.local\bin\uv.exe'
args = ['--directory', 'C:\MCP_V3\MCP_EXTERNAL\Windows-MCP', 'run', 'windows-mcp']
enabled = false

[mcp_servers.external_windows_mcp.env]
ANONYMIZED_TELEMETRY = "false"
WINDOWS_MCP_SCREENSHOT_SCALE = "0.5"

[mcp_servers.external_aws_api]
command = '%USERPROFILE%\.local\bin\uv.exe'
args = ['--directory', 'C:\MCP_V3\MCP_EXTERNAL\awslabs-mcp\src\aws-api-mcp-server', 'run', 'awslabs.aws-api-mcp-server']
enabled = false

[mcp_servers.external_aws_api.env]
AWS_REGION = "us-east-1"
AWS_PROFILE = "default"
AWS_API_MCP_TELEMETRY = "false"
READ_OPERATIONS_ONLY = "true"

[mcp_servers.external_esxi_vcenter]
command = 'C:\MCP_V3\MCP_EXTERNAL\esxi-mcp-server\.venv\Scripts\python.exe'
args = ['C:\MCP_V3\MCP_EXTERNAL\esxi-mcp-server\server.py', '-c', 'C:\MCP_V3\MCP_EXTERNAL\esxi-mcp-server\config.yaml']
enabled = false

[mcp_servers.external_mcp_ssh_manager]
command = 'C:\MCP_V3\node-v22.20.0-win-x64\node.exe'
args = ['C:\MCP_V3\MCP_EXTERNAL\npm-packages\node_modules\mcp-ssh-manager\src\index.js']
enabled = false

[mcp_servers.external_mcp_ssh_bridge]
command = 'C:\MCP_V3\MCP_EXTERNAL\mcp-ssh-bridge\.venv\Scripts\python.exe'
args = ['-m', 'ssh_mcp_bridge', 'C:\MCP_V3\MCP_EXTERNAL\mcp-ssh-bridge\config.yaml']
enabled = false

[mcp_servers.external_windows_admin]
command = 'C:\MCP_V3\MCP_EXTERNAL\windows-admin-mcp\.venv\Scripts\python.exe'
args = ['C:\MCP_V3\MCP_EXTERNAL\windows-admin-mcp\windows_admin_server.py']
enabled = false

[mcp_servers.external_windows_admin.env]
WINDOWS_ADMIN_LOG_DIR = 'C:\MCP_V3\MCP_EXTERNAL\windows-admin-mcp\logs'

[mcp_servers.external_chrome_devtools]
command = 'C:\MCP_V3\node-v22.20.0-win-x64\node.exe'
args = ['C:\MCP_V3\MCP_EXTERNAL\npm-packages\node_modules\chrome-devtools-mcp\build\src\bin\chrome-devtools-mcp.js', '--executablePath', 'C:\MCP_V3\ungoogled-chromium\chrome.exe']
enabled = false

[mcp_servers.external_sequential_thinking]
command = 'C:\MCP_V3\node-v22.20.0-win-x64\node.exe'
args = ['C:\MCP_V3\MCP_EXTERNAL\npm-packages\node_modules\@modelcontextprotocol\server-sequential-thinking\dist\index.js']
enabled = false

[mcp_servers.external_powershell_mcp]
command = '%USERPROFILE%\Documents\PowerShell\Modules\PowerShell.MCP\1.3.7\bin\PowerShell.MCP.Proxy.exe'
args = []
enabled = false

# Remote Cloudflare MCP servers. Requires Codex/client support for remote streamable HTTP MCP.
# Some endpoints require OAuth/API token when first connected.

[mcp_servers.cloudflare_docs]
url = 'https://docs.mcp.cloudflare.com/mcp'
enabled = false

[mcp_servers.cloudflare_api]
url = 'https://mcp.cloudflare.com/mcp'
enabled = false

[mcp_servers.cloudflare_bindings]
url = 'https://bindings.mcp.cloudflare.com/mcp'
enabled = false

[mcp_servers.cloudflare_builds]
url = 'https://builds.mcp.cloudflare.com/mcp'
enabled = false

[mcp_servers.cloudflare_observability]
url = 'https://observability.mcp.cloudflare.com/mcp'
enabled = false

[mcp_servers.cloudflare_radar]
url = 'https://radar.mcp.cloudflare.com/mcp'
enabled = false

[mcp_servers.cloudflare_browser]
url = 'https://browser.mcp.cloudflare.com/mcp'
enabled = false

[mcp_servers.cloudflare_logs]
url = 'https://logs.mcp.cloudflare.com/mcp'
enabled = false

[mcp_servers.cloudflare_ai_gateway]
url = 'https://ai-gateway.mcp.cloudflare.com/mcp'
enabled = false
